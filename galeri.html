<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri | Beta Yapı İnşaat</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: var(--gri); overflow-x: hidden; }

        .gallery-wrap {
            max-width: 1200px;
            margin: 0 auto;
            padding: 110px 20px 40px;
        }
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .gallery-item {
            border-radius: 12px; overflow: hidden;
            border: 1px solid #e5e7ef; background: #fff;
            box-shadow: 0 3px 10px rgba(0,0,0,0.07);
            transition: transform 0.3s;
        }
        .gallery-item:hover { transform: translateY(-5px); }
        .gallery-item img {
            width: 100%; height: 240px;
            object-fit: cover; display: block;
        }
        .back-btn {
            display: inline-flex; align-items: center; gap: 8px;
            margin-bottom: 20px; text-decoration: none;
            background: var(--beyaz); padding: 10px 18px;
            border-radius: 8px; border: 1px solid #e5e7ef;
            color: var(--ana-renk); font-weight: 500;
            transition: background 0.2s;
        }
        .back-btn:hover { background: var(--vurgu-renk); color: var(--ana-renk); }
        #baslik { color: var(--ana-renk); margin: 10px 0 5px; font-size: 1.8rem; }

        #bos {
            margin-top: 20px; padding: 20px;
            border: 1px dashed #cfd5e3;
            border-radius: 12px; background: #fff;
            color: #888; text-align: center;
        }

        @media (max-width: 768px) {
            .gallery-grid { grid-template-columns: 1fr; }
            .gallery-wrap { padding-top: 100px; }
        }
    </style>
</head>

<body>
    <header>
        <a href="index.html" class="logo">
            <img src="image_1.png" alt="BETA YAPI İNŞAAT Logo">
            <span>BETA YAPI İNŞAAT</span>
        </a>
        <div class="menu-toggle" onclick="menuyuAcKapa()"><i class="fas fa-bars"></i></div>
        <nav id="ana-menu">
            <ul>
                <li><a href="index.html">Anasayfa</a></li>
                <li><a href="hesapla.html">Fiyat Hesapla</a></li>
                <li><a href="sss.html">SSS</a></li>
                <li><a href="iletisim.html">İletişim</a></li>
                <li><a href="projeler.html">Projelerimiz</a></li>
            </ul>
        </nav>
    </header>

    <div class="gallery-wrap">
        <a class="back-btn" href="projeler.html"><i class="fas fa-arrow-left"></i> Projelere Dön</a>
        <h1 id="baslik">Galeri</h1>
        <p id="aciklama" style="color:#666; margin:0;"></p>
        <div id="galeri" class="gallery-grid"></div>
        <div id="bos" style="display:none;">Bu kategori için henüz görsel eklenmemiş.</div>
    </div>

    <a href="https://wa.me/905335537529" class="whatsapp-float" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp ile iletişime geçin">
        <i class="fab fa-whatsapp"></i>
    </a>

    <script>
        function menuyuAcKapa() {
            document.getElementById("ana-menu").classList.toggle("aktif");
        }

        const GALERILER = {
            "celik-villa": {
                baslik: "Çelik Ev Galerisi",
                aciklama: "Çelik villa ve çelik ev projeleri",
                resimler: [
                    "galeri/ornek-celik-ev.jpg",
                    "galeri/ornek-celik-ev.jpg"
                ]
            },
            "prefabrik": {
                baslik: "Prefabrik Ev Galerisi",
                aciklama: "Prefabrik yapı projeleri",
                resimler: [
                    "galeri/ornek-prefabrik-ev.jpg"
                ]
            },
            "konteyner": {
                baslik: "Konteyner Galerisi",
                aciklama: "Konteyner ofis ve yaşam alanları",
                resimler: [
                    "galeri/ornek-celik-ev.jpg"
                ]
            }
        };

        const params = new URLSearchParams(window.location.search);
        const kategori = params.get("kategori");
        const data = GALERILER[kategori];

        if (!data) {
            document.getElementById("baslik").textContent = "Galeri bulunamadı";
            document.getElementById("aciklama").textContent = "Kategori parametresi hatalı veya eksik.";
            document.getElementById("bos").style.display = "block";
        } else {
            document.getElementById("baslik").textContent = data.baslik;
            document.getElementById("aciklama").textContent = data.aciklama;

            const galeri = document.getElementById("galeri");
            if (!data.resimler || data.resimler.length === 0) {
                document.getElementById("bos").style.display = "block";
            } else {
                data.resimler.forEach((src) => {
                    galeri.insertAdjacentHTML("beforeend", `
                        <div class="gallery-item">
                            <img src="${src}" alt="${data.baslik}" loading="lazy">
                        </div>
                    `);
                });
            }
        }
    </script>
</body>
</html>
